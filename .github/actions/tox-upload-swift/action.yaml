name: "Upload Docs Preview to Swift"
description: "Compresses documentation, uploads it to OpenTelekomCloud Swift, and comments on PR with preview link."

inputs:
  docs_path:
    description: "Path to the built documentation directory"
    required: false
    default: "doc/build/html"
  docs_service:
    description: "Service name to use in the preview URL (e.g., elastic-cloud-server)"
    required: false
    default: "elastic-cloud-server"
  swift_container:
    description: "Swift container name for storing docs (e.g., gitea_action_logs)"
    required: false
    default: "gitea_action_logs"
  otc_swift_username:
    description: "OpenTelekomCloud Swift username"
    required: true
  otc_swift_password:
    description: "OpenTelekomCloud Swift password"
    required: true
  otc_swift_project_name:
    description: "OpenTelekomCloud Swift project name"
    required: true
  otc_swift_domain:
    description: "OpenTelekomCloud Swift domain"
    required: true
  otc_swift_endpoint:
    description: "OpenTelekomCloud Swift endpoint"
    required: true
  otc_swift_preview_endpoint:
    description: >-
      Optional endpoint used for the preview URL in the PR comment. The upload
      itself always goes to otc_swift_endpoint; set this to the externally
      reachable endpoint when otc_swift_endpoint points to an internal cluster
      domain. Leave unset to reuse otc_swift_endpoint.
    required: false
    default: ""
  swift_container_public:
    description: >-
      Whether the Swift container may be read anonymously. Leave unset to derive
      it from ci_platform: gitea uploads go to an internal account and default to
      "false", everything else defaults to "true". Set explicitly to override.
      The account itself comes from the OTC_SWIFT_PROJECT_NAME secret and is not
      visible here, which is why the platform is used as the proxy for it.
    required: false
    default: ""
  pdf_links:
    description: >-
      Whether the PR comment lists every PDF as a direct file link instead of
      the folder preview URL. Directory listings are disabled on Swift, so a
      folder URL only resolves for HTML builds that have an index.html; a
      PDF-only build needs each file linked individually. Leave unset to
      derive it from docs_path: true when docs_path ends in /pdf (e.g.
      doc/build/pdf), false otherwise. Set "true"/"false" to override.
    required: false
    default: ""
  gitea_token:
    description: "Gitea API token (for commenting)"
    required: true
  gitea_server_url:
    description: "Base URL of your Gitea server"
    required: true
  repo:
    description: "Repository in owner/name format"
    required: true
  pr_number:
    description: "Pull request number"
    required: false
  run_id:
    description: "Unique run ID for naming preview container"
    required: true
  ci_platform:
    description: "Where this action runs: github or gitea"
    required: false
    default: "gitea"
  github_token:
    description: "GitHub token for commenting"
    required: false

runs:
  using: "composite"
  steps:
    - name: Compress documentation into .tar.gz
      shell: bash
      run: |
        tar -czf docs.tar.gz -C "${{ inputs.docs_path }}" .
        mkdir -p ./library
        mkdir -p ./playbooks
        cp docs.tar.gz ./library/docs.tar.gz
        cp docs.tar.gz playbooks/docs.tar.gz

    - name: Write clouds.yaml
      shell: bash
      run: |
        mkdir -p ~/.config/openstack
        cat > ~/.config/openstack/clouds.yaml <<EOF
        clouds:
          otc:
            profile: otc
            auth:
              auth_url: https://iam.eu-de.otc.t-systems.com:443/v3
              username: ${{ inputs.otc_swift_username }}
              password: ${{ inputs.otc_swift_password }}
              project_name: ${{ inputs.otc_swift_project_name }}
              user_domain_name: ${{ inputs.otc_swift_domain }}
            interface: public
            identity_api_version: 3
            object_store_endpoint_override: ${{ inputs.otc_swift_endpoint }}
        EOF

    - name: Install dependencies for Swift upload
      shell: bash
      run: |
        python -m pip install --quiet openstacksdk ansible requests requestsexceptions ansible

    - name: Clone up-to-date upload script
      shell: bash
      run: |
        set -euo pipefail
        # -f matters: without it curl writes the 404 body into the module file.
        curl -sSLf -o ./library/upload_artifact_swift.py \
          https://raw.githubusercontent.com/opentelekomcloud-infra/github-actions/refs/heads/main/library/upload_artifact_swift.py

    - name: Clone up-to-date playbook
      shell: bash
      run: |
        set -euo pipefail
        curl -sSLf -o ./playbooks/upload_swift_preview.yml \
          https://raw.githubusercontent.com/opentelekomcloud-infra/github-actions/refs/heads/main/playbooks/upload_swift_preview.yml

    - name: Upload to Swift as preview
      shell: bash
      env:
        RUN_ID: ${{ inputs.run_id }}
        SRC_FILE: docs.tar.gz
        DOCS_SERVICE: ${{ inputs.docs_service }}
        SWIFT_CONTAINER: ${{ inputs.swift_container }}
        SWIFT_CONTAINER_PUBLIC: ${{ inputs.swift_container_public }}
        CI_PLATFORM: ${{ inputs.ci_platform }}
      run: |
        set -euo pipefail
        PUBLIC="${SWIFT_CONTAINER_PUBLIC}"
        if [ -z "${PUBLIC}" ]; then
          if [ "${CI_PLATFORM}" = "gitea" ]; then PUBLIC=false; else PUBLIC=true; fi
        fi
        ansible-playbook -i localhost, -M ./library \
          -e "run_id=$RUN_ID" \
          -e "src_file=$SRC_FILE" \
          -e "docs_service=$DOCS_SERVICE" \
          -e "swift_container=$SWIFT_CONTAINER" \
          -e "swift_container_public=$PUBLIC" \
          playbooks/upload_swift_preview.yml

    - name: Comment on PR with container name
      if: ${{ inputs.pr_number != '' }}
      shell: bash
      env:
        CI_PLATFORM: ${{ inputs.ci_platform }}
        SWIFT_ENDPOINT: ${{ inputs.otc_swift_endpoint }}
        PREVIEW_ENDPOINT: ${{ inputs.otc_swift_preview_endpoint }}
        SWIFT_CONTAINER: ${{ inputs.swift_container }}
        DOCS_SERVICE: ${{ inputs.docs_service }}
        RUN_ID: ${{ inputs.run_id }}
        DOCS_PATH: ${{ inputs.docs_path }}
        PDF_LINKS: ${{ inputs.pdf_links }}
        PR_NUMBER: ${{ inputs.pr_number }}
        REPO: ${{ inputs.repo }}
        # gitea
        GITEA_TOKEN: ${{ inputs.gitea_token }}
        GITEA_SERVER_URL: ${{ inputs.gitea_server_url }}
        # github
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail
        # Default to the upload endpoint for the comment URL; a separately
        # supplied preview endpoint wins (e.g. external URL when the upload
        # endpoint is an internal cluster domain).
        BASE_URL="${PREVIEW_ENDPOINT:-$SWIFT_ENDPOINT}/${SWIFT_CONTAINER}/${DOCS_SERVICE}/${RUN_ID}"
        # PDF builds have no index.html, so the folder URL 404s. Link each
        # PDF file directly instead. Defaults from docs_path: on for
        # */pdf, off otherwise; the input overrides.
        PDF_MODE="${PDF_LINKS}"
        if [ -z "${PDF_MODE}" ]; then
          case "${DOCS_PATH}" in */pdf|pdf) PDF_MODE=true ;; *) PDF_MODE=false ;; esac
        fi
        if [ "${PDF_MODE}" = "true" ]; then
          # List files as paths relative to the docs root (slash-separated)
          # and build one markdown link per PDF. Each path segment is
          # percent-encoded but the slashes are kept literal: Swift resolves
          # the whole remainder of the URL path as the object name, exactly
          # like the web-index HTML preview does with its relative assets.
          # Encoding the slashes as %2F would 404 on nested files.
          BODY="$(cd "${DOCS_PATH}" && find . -type f -name '*.pdf' -print | sed 's|^\./||' | LC_ALL=C sort | python3 -c '
        import sys
        from urllib.parse import quote
        base = sys.argv[1]
        body = "📦 PDF Preview-Documentation uploaded to Swift:"
        files = [line.strip() for line in sys.stdin if line.strip()]
        if not files:
            body += f"\n\nNo PDF files found in {base}/"
        else:
            # Blank line after the header: a list that directly follows a
            # paragraph line is not rendered as a list by GFM (GitHub/Gitea),
            # it folds into the paragraph as one line.
            body += "\n"
            for name in files:
                encoded = "/".join(quote(seg, safe="") for seg in name.split("/"))
                body += f"\n- [📄 {name}]({base}/{encoded})"
        print(body)
        ' "${BASE_URL}")"
        else
          BODY="📦 HTML Preview-Documentation uploaded to Swift: ${BASE_URL}/"
        fi
        # JSON-encode with python so multi-line bodies (the PDF list) survive
        # the API payload; raw newlines in the inline -d string break it.
        PAYLOAD="$(python3 -c 'import json,sys; print(json.dumps({"body": sys.stdin.read()}))' <<< "${BODY}")"
        if [ "${CI_PLATFORM}" = "github" ]; then
          API="${GITHUB_API_URL:-https://api.github.com}"
          curl -s \
            -H "Authorization: Bearer ${INPUT_GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -X POST \
            -d "${PAYLOAD}" \
            "${API}/repos/${REPO}/issues/${PR_NUMBER}/comments"
        else
          curl -s \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d "${PAYLOAD}" \
            "${GITEA_SERVER_URL}/api/v1/repos/${REPO}/issues/${PR_NUMBER}/comments"
        fi
