name: pytest

# tox-upload-swift fetches library/ and playbooks/ from main on every run,
# so a change there is live for every consumer as soon as it is merged.
on:
  push:
    branches: [main]
    paths:
      - 'library/**'
      - 'playbooks/**'
      - 'tests/**'
      - 'requirements-test.txt'
      - '.github/workflows/pytest.yaml'
  pull_request:
    paths:
      - 'library/**'
      - 'playbooks/**'
      - 'tests/**'
      - 'requirements-test.txt'
      - '.github/workflows/pytest.yaml'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --quiet -r requirements-test.txt

      - name: Lint
        run: flake8 library tests

      - name: Test
        run: pytest tests -q
