- hosts: localhost
  connection: local
  vars:
    run_id: "{{ run_id | default('manual-run') }}"
  tasks:
    - name: Upload compressed docs to Swift
      upload_artifact_swift:
        cloud:
          cloud: otc
        container: "{{ swift_container }}"
        prefix: "{{ docs_service }}/{{ run_id }}"
        src: "{{ src_file }}"
        # Defaults to true so callers that do not pass it are unaffected.
        public: "{{ swift_container_public | default(true) | bool }}"
        delete_after: "604800"